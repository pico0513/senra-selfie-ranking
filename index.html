<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>センラさん自撮り選手権</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <h1>
      センラさん<br>
      自撮り選手権
    </h1>

    <p id="round" class="round">
      ROUND 1
    </p>

    <p id="remaining" class="remaining">
      残り 17 枚
    </p>

    <p id="message" class="message">
      どっちの自撮りが好き？
    </p>

    <div class="choices">

      <!-- 上 -->
      <button
        id="choiceA"
        class="choice"
        type="button"
      >
        <div class="post-box"></div>
      </button>

      <div class="vs">
        VS
      </div>

      <!-- 下 -->
      <button
        id="choiceB"
        class="choice"
        type="button"
      >
        <div class="post-box"></div>
      </button>

    </div>

  </main>

  <!-- X公式ウィジェット -->

  <script
    async
    src="https://platform.twitter.com/widgets.js"
    charset="utf-8">
  </script>

  <script src="script.js"></script>

</body>
</html>
