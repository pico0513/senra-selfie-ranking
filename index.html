<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>センラさんの好きな自撮り選手権</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>センラさんの<br>好きな自撮り選手権</h1>

    <p class="description">
      どっちの自撮りが好き？<br>
      直感で選んでね 💛
    </p>

    <div class="progress">
      <span id="round">ROUND 1</span>
    </div>

    <div class="battle">

      <button class="choice" id="choiceA">
        <div class="post-box">
          <p>自撮り A</p>
          <span>ここにXの投稿が入ります</span>
        </div>
      </button>

      <div class="vs">VS</div>

      <button class="choice" id="choiceB">
        <div class="post-box">
          <p>自撮り B</p>
          <span>ここにXの投稿が入ります</span>
        </div>
      </button>

    </div>

    <p id="message"></p>

  </main>

  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script src="script.js"></script>

</body>
</html>
