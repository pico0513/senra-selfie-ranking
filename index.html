<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>センラさん自撮り選手権</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <h1>
      センラさん<br>
      自撮り選手権
    </h1>

    <p id="round" class="round">
      ROUND 1
    </p>

    <!-- ゲーム進行ゲージ -->
    <div class="progress-area">

      <div
        id="progressText"
        class="progress-text"
      >
        優勝まであと 16 回
      </div>

      <div class="progress-bar">

        <div
          id="progressFill"
          class="progress-fill">
        </div>

      </div>

    </div>

    <p id="message" class="message">
      どっちの自撮りが好き？
    </p>


    <div class="choices">

      <!-- 上の自撮り -->

      <button
        id="choiceA"
        class="choice"
        type="button"
      >

        <div class="post-box"></div>

      </button>


      <div class="vs">
        VS
      </div>


      <!-- 下の自撮り -->

      <button
        id="choiceB"
        class="choice"
        type="button"
      >

        <div class="post-box"></div>

      </button>

    </div>

  </main>


  <!-- X公式ウィジェット -->

  <script
    async
    src="https://platform.twitter.com/widgets.js"
    charset="utf-8">
  </script>


  <!-- ゲーム本体 -->

  <script src="script.js"></script>

</body>

</html>
